# XcodeGen spec — run `xcodegen generate` in this folder on a Mac to produce
# CatBreak.xcodeproj (the .xcodeproj itself is generated and gitignored).
name: CatBreak
options:
  bundleIdPrefix: com.catbreak
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    # Set your Apple team id once here (or per-target in Xcode's Signing pane):
    # DEVELOPMENT_TEAM: ABCDE12345

targets:
  CatBreak:
    type: application
    platform: iOS
    sources:
      - path: CatBreak
        excludes:
          - "Info.plist"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.catbreak.app
        INFOPLIST_FILE: CatBreak/Info.plist
        CODE_SIGN_ENTITLEMENTS: CatBreak/CatBreak.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: MonitorExtension
      - target: ShieldConfigExtension
      - target: ShieldActionExtension
      - target: ReportExtension

  MonitorExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: MonitorExtension
        excludes:
          - "Info.plist"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.catbreak.app.monitor
        INFOPLIST_FILE: MonitorExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: MonitorExtension/MonitorExtension.entitlements
        SKIP_INSTALL: true

  ShieldConfigExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShieldConfigExtension
        excludes:
          - "Info.plist"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.catbreak.app.shieldconfig
        INFOPLIST_FILE: ShieldConfigExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShieldConfigExtension/ShieldConfigExtension.entitlements
        SKIP_INSTALL: true

  ShieldActionExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShieldActionExtension
        excludes:
          - "Info.plist"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.catbreak.app.shieldaction
        INFOPLIST_FILE: ShieldActionExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShieldActionExtension/ShieldActionExtension.entitlements
        SKIP_INSTALL: true

  ReportExtension:
    type: extensionkit-extension
    platform: iOS
    sources:
      - path: ReportExtension
        excludes:
          - "Info.plist"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.catbreak.app.report
        INFOPLIST_FILE: ReportExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ReportExtension/ReportExtension.entitlements
        SKIP_INSTALL: true
